<mat-toolbar color="primary">
  <!-- Logo y título de la aplicación -->
  <img src="Nutri.jpg" alt="Logo" class="app-logo">
  <span class="app-title">Nutrimentor</span>

  <span class="spacer"></span>

  <!-- Botones principales -->
  <button mat-button routerLink="/home" aria-label="Home">Home</button>
  <button mat-button routerLink="/nosotros" aria-label="Nosotros">Nosotros</button>
  <button mat-button routerLink="/servicios" aria-label="Servicios">Servicios</button>
  <button mat-button routerLink="/productos" aria-label="Productos">Productos</button>
  <button mat-button routerLink="/compras" aria-label="Compra">Compra</button>
  <button mat-button routerLink="/detalleCompra" aria-label="Detalle">Detalle de compra</button>

  <button mat-icon-button [matMenuTriggerFor]="Menu" aria-label="Botón de menú">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Menú desplegable -->
  <mat-menu #Menu="matMenu">
    <button mat-menu-item routerLink="/home">
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
    <button *ngIf="isUser || isAdmin" mat-menu-item routerLink="/clientes">
      <mat-icon>person</mat-icon>
      <span>Cliente</span>
    </button>
    <button *ngIf="isAdmin" mat-menu-item routerLink="/productos">
      <mat-icon>inventory</mat-icon>
      <span>Producto</span>
    </button>
    <button *ngIf="isAdmin" mat-menu-item routerLink="/categorias">
      <mat-icon>category</mat-icon>
      <span>Categoria</span>
    </button>
    <button *ngIf="isUser || isAdmin" mat-menu-item routerLink="/compras">
      <mat-icon>add_shopping_cart</mat-icon>
      <span>Compra</span>
    </button>
    <button *ngIf="isUser || isAdmin" mat-menu-item routerLink="/detalleCompra">
      <mat-icon>receipt_long</mat-icon>
      <span>Detalle de Compra</span>
    </button>
    <button *ngIf="isAdmin" mat-menu-item routerLink="/especialidades">
      <mat-icon>school</mat-icon>
      <span>Especialidad</span>
    </button>
    <button *ngIf="isHealthProfessional || isAdmin" mat-menu-item routerLink="/profesionales">
      <mat-icon>medical_services</mat-icon>
      <span>Profesional de salud</span>
    </button>
    <button *ngIf="isUser || isAdmin" mat-menu-item routerLink="/resenas">
      <mat-icon>rate_review</mat-icon>
      <span>Reseña</span>
    </button>
    <button *ngIf="isHealthProfessional || isAdmin" mat-menu-item routerLink="/recomendaciones">
      <mat-icon>thumb_up</mat-icon>
      <span>Recomendaciones</span>
    </button>
    <button *ngIf="isHealthProfessional || isAdmin" mat-menu-item routerLink="/seguimientos">
      <mat-icon>track_changes</mat-icon>
      <span>Seguimientos</span>
    </button>
    <button *ngIf="isUser || isAdmin" mat-menu-item routerLink="/objetivosSalud">
      <mat-icon>health_and_safety</mat-icon>
      <span>Objetivos de Salud</span>
    </button>
    <button *ngIf="isUser || isHealthProfessional || isAdmin" mat-menu-item routerLink="/preguntas">
      <mat-icon>question_answer</mat-icon>
      <span>Preguntas</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </mat-menu>
</mat-toolbar>
